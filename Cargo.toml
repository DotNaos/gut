[package]
name = "gut"
version = "0.1.0"
edition = "2024"
description = "Good Git: small Git helpers for everyday repository inspection and cleanup"
license = "MIT"
repository = "https://github.com/DotNaos/gut"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
